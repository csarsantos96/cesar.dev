name: Traduzir portfolio (PT -> EN)

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/pt.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar en.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate.mjs

      - name: Commit da traducao
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/lib/en.json src/lib/.pt.cache.json; then
            echo "Sem mudancas."
          else
            git add src/lib/en.json src/lib/.pt.cache.json
            git commit -m "chore(i18n): atualiza en.json automaticamente [skip ci]"
            git push
          fi